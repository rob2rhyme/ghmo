version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Type definitions must match the Node version the site runs on (22, see "engines").
      # Raise this together with the runtime, not on its own.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) is not supported by typescript-eslint (needs < 6.1) and drops
      # tsconfig "baseUrl". Remove this once typescript-eslint supports it (see PR #63).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      react-next:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "next", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
