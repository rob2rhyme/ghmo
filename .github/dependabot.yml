version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-next:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "next", "eslint-config-next"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
