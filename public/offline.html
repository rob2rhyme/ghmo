<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · GHMO</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 96px; height: 96px; }
      h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
      p { color: #475569; line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 0.5rem; background: #0f766e; color: #fff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) { body { background: #0b1220; color: #e2e8f0; } p { color: #94a3b8; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page needs an internet connection. Check your connection, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
